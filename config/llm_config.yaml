backend:
  provider: openai_compatible
  base_url_env: URL
  api_key_env: API_KEY
  model_env: MODEL_NAME
  base_url: "https://api.deepseek.com/v1"
  api_key: ""
  model: "deepseek-flash"
  temperature: 0.2
  max_tokens: 1800
  timeout_seconds: 180
  extra_body_env: CSDM_PANEL_LLM_EXTRA_BODY
  extra_body:
    thinking:
      type: disabled

candidate_generation:
  max_candidates_per_request: 20
  max_attempts: 3
  max_tokens: 8192

report_explanation:
  max_output_tokens: 2048
