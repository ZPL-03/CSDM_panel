project:
  name: CSDM_panel
  timezone: Asia/Shanghai
  default_language: zh-CN

paths:
  data_dir: data
  io_dir: data/io
  results_dir: data/results
  cases_dir: data/cases
  abaqus_runs_dir: data/abaqus_runs
  knowledge_dir: knowledge
  chroma_dir: knowledge/chroma_db
  case_library_dir: knowledge/case_library
  models_dir: models

abaqus:
  command: abaqus
  cae_args: "cae noGUI="
  python_args: "python"
  max_retries: 3
  job_timeout_seconds: 1800
  poll_interval_seconds: 5
  cleanup_patterns:
    - "*.lck"
    - "*.023"
    - "*.com"

pipeline:
  top_k: 5
  llm_candidates: 4
  case_transfer_candidates: 2
  doe_candidates: 4
  min_case_records_for_retrain: 50
  random_seed: 42
  screening_score:
    blf_weight: 1.0
    weight_penalty: 0.08

rag:
  embedding_model: BAAI/bge-m3
  embedding_cache_dir: models/embedding_cache
  local_files_only: true
  use_hash_embedding_only: false
  allow_hash_fallback: true

case_memory:
  collection_name: csdm_case_memory
  hybrid_retrieval: true
  vector_top_k_multiplier: 4
  vector_rank_weight: 0.1

external_knowledge:
  enabled: true
  base_dir: knowledge/external
  rag_chunks_path: knowledge/external/rag/rag_chunks.jsonl
  kg_dir: knowledge/external/kg
  manifest_path: knowledge/external/manifest.json
  top_k: 5
  kg_top_k: 8
  max_snippet_chars: 1200

conversation:
  confirmation_steps:
    - screen_candidates
    - fem_evaluation
    - export_report

report:
  output_markdown: data/results/latest_report.md
  output_pdf: data/results/latest_report.pdf
